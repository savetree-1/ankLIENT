<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ankLIENT</title>
<link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Josefin Sans',system-ui,sans-serif;background:url('/assets/chat_bg.png') center/cover no-repeat fixed;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
header{padding:18px 24px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.logo{font-size:.9rem;font-weight:700;letter-spacing:4px;text-transform:uppercase;color:#fff;text-shadow:0 1px 12px rgba(0,0,0,.8)}
.logo span{color:#19c37d}
.pulse{width:9px;height:9px;border-radius:50%;background:#19c37d;box-shadow:0 0 8px #19c37d}
#chat{flex:1;overflow-y:auto;padding:16px 20px 12px;display:flex;flex-direction:column;gap:16px}
#chat::-webkit-scrollbar{width:4px}
#chat::-webkit-scrollbar-thumb{background:rgba(255,255,255,.2);border-radius:2px}
.hero{margin:auto;text-align:center;padding:20px 16px;pointer-events:none}
.hero h1{font-size:clamp(2rem,7vw,3.8rem);font-weight:700;letter-spacing:5px;text-transform:uppercase;color:#fff;line-height:1.1;text-shadow:0 2px 8px rgba(0,0,0,.85),0 0 40px rgba(0,0,0,.4);margin-bottom:14px}
.hero p{color:rgba(255,255,255,.7);font-size:.85rem;letter-spacing:2px;text-shadow:0 1px 6px rgba(0,0,0,.8)}
.row{display:flex;gap:10px;align-items:flex-end;max-width:700px;width:100%;margin:0 auto}
.row.user{flex-direction:row-reverse}
.bubble{max-width:calc(100% - 44px);padding:12px 18px;border-radius:20px;font-size:.95rem;line-height:1.65;word-break:break-word}
.row.user .bubble{background:rgba(0,0,0,.60);color:#fff;border:1px solid rgba(255,255,255,.12);border-bottom-right-radius:5px;backdrop-filter:blur(8px)}
.row.ai .bubble{background:rgba(255,255,255,.10);color:#fff;border:1px solid rgba(255,255,255,.18);border-bottom-left-radius:5px;backdrop-filter:blur(16px);text-shadow:0 1px 4px rgba(0,0,0,.4)}
.bubble p{margin:0 0 8px}
.bubble p:last-child{margin:0}
.bubble strong{color:#fff;font-weight:600}
.bubble code{background:rgba(0,0,0,.4);padding:1px 5px;border-radius:3px;font-family:monospace;font-size:.87em}
.bubble pre{background:rgba(0,0,0,.65);border-radius:10px;padding:12px;overflow-x:auto;margin:8px 0}
.bubble pre code{background:none;padding:0}
.bubble h1,.bubble h2,.bubble h3{margin:10px 0 5px;color:#fff}
.bubble ul,.bubble ol{padding-left:20px;margin:6px 0}
.bubble li{margin:3px 0}
.dots{display:inline-flex;gap:5px;padding:4px 0;align-items:center}
.dots span{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.5);animation:pop 1.2s infinite both}
.dots span:nth-child(2){animation-delay:.2s}
.dots span:nth-child(3){animation-delay:.4s}
@keyframes pop{0%,80%,100%{transform:scale(.4);opacity:.4}40%{transform:scale(1);opacity:1}}
.bar{flex-shrink:0;padding:12px 16px 20px;background:rgba(0,0,0,.42);backdrop-filter:blur(20px);border-top:1px solid rgba(255,255,255,.09)}
.bar-row{max-width:700px;margin:0 auto;display:flex;align-items:flex-end;gap:10px;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.22);border-radius:22px;padding:10px 12px;transition:border-color .2s}
.bar-row:focus-within{border-color:rgba(25,195,125,.75)}
textarea{flex:1;background:transparent;border:none;outline:none;color:#fff;font-family:'Josefin Sans',system-ui,sans-serif;font-size:15px;resize:none;max-height:140px;line-height:1.5}
textarea::placeholder{color:rgba(255,255,255,.38)}
#sendBtn{width:40px;height:40px;border-radius:50%;border:none;background:#19c37d;color:#000;cursor:pointer;font-size:16px;font-weight:bold;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:opacity .2s,transform .15s}
#sendBtn:disabled{opacity:.35;cursor:default}
#sendBtn:hover:not(:disabled){opacity:.85;transform:scale(1.06)}
.note{max-width:700px;margin:7px auto 0;text-align:center;font-size:10px;letter-spacing:.5px;color:rgba(255,255,255,.28)}
</style>
</head>
<body>
<header>
  <div class="logo">ank<span>LIENT</span></div>
  <div class="pulse" id="dot"></div>
</header>
<div id="chat">
  <div class="hero" id="hero">
    <h1>What can I<br>help with?</h1>
    <p>Your personal ChatGPT &mdash; running in the cloud</p>
  </div>
</div>
<div class="bar">
  <div class="bar-row">
    <textarea id="inp" rows="1" placeholder="Message ChatGPT..."></textarea>
    <button id="sendBtn">&#9650;</button>
  </div>
  <p class="note">ankLIENT may produce inaccurate information &mdash; verify important facts</p>
</div>
<script>
var inp=document.getElementById('inp');
var btn=document.getElementById('sendBtn');
var chat=document.getElementById('chat');
var busy=false;
var hist=[];

inp.addEventListener('input',function(){
  inp.style.height='auto';
  inp.style.height=Math.min(inp.scrollHeight,140)+'px';
});
inp.addEventListener('keydown',function(e){
  if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();}
});
btn.addEventListener('click',send);

function send(){
  if(busy)return;
  var text=inp.value.trim();
  if(!text)return;
  var hero=document.getElementById('hero');
  if(hero)hero.remove();
  busy=true;
  btn.disabled=true;
  inp.value='';
  inp.style.height='auto';
  hist.push({role:'user',content:text});
  appendBubble(esc(text),'user');
  var aiRow=document.createElement('div');
  aiRow.className='row ai';
  aiRow.innerHTML='<div class="bubble"><div class="dots"><span></span><span></span><span></span></div></div>';
  chat.appendChild(aiRow);
  bot();
  var bub=aiRow.querySelector('.bubble');
  fetch('/v1/chat/completions',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({model:'auto',messages:hist,stream:false})
  }).then(function(r){
    if(!r.ok)throw new Error('HTTP '+r.status);
    return r.json();
  }).then(function(d){
    var reply=d.choices[0].message.content||'';
    hist.push({role:'assistant',content:reply});
    bub.innerHTML=md(reply);
    bot();
  }).catch(function(e){
    bub.innerHTML='<span style="color:#ff6b6b">Error: '+e.message+'</span>';
  }).finally(function(){
    busy=false;
    btn.disabled=false;
    inp.focus();
    bot();
  });
}

function appendBubble(html,role){
  var row=document.createElement('div');
  row.className='row '+role;
  row.innerHTML='<div class="bubble">'+html+'</div>';
  chat.appendChild(row);
  bot();
}

function bot(){chat.scrollTop=chat.scrollHeight;}

function md(s){
  s=s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  s=s.replace(/```[\w]*\n?([\s\S]*?)```/g,'<pre><code>$1</code></pre>');
  s=s.replace(/`([^`]+)`/g,'<code>$1</code>');
  s=s.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
  s=s.replace(/\*([^*]+?)\*/g,'<em>$1</em>');
  s=s.replace(/^### (.+)$/gm,'<h3>$1</h3>');
  s=s.replace(/^## (.+)$/gm,'<h2>$1</h2>');
  s=s.replace(/^# (.+)$/gm,'<h1>$1</h1>');
  s=s.replace(/^[ \t]*[-*+] (.+)$/gm,'<li>$1</li>');
  s=s.replace(/\n/g,'<br>');
  return s;
}

function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

fetch('/health').then(function(r){return r.json();}).then(function(d){
  var dot=document.getElementById('dot');
  var ok=d.status==='healthy';
  dot.style.background=ok?'#19c37d':'#f59e0b';
  dot.style.boxShadow='0 0 8px '+(ok?'#19c37d':'#f59e0b');
}).catch(function(){
  document.getElementById('dot').style.background='#ef4444';
});
</script>
</body>
</html>

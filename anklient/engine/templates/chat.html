<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ankLIENT</title>
<link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
  font-family:'Josefin Sans',system-ui,sans-serif;
  background:url('/assets/chat_bg.png') center/cover no-repeat fixed;
  height:100dvh;
  display:flex;
  flex-direction:column;
  overflow:hidden;
  color:#fff;
}
body::before{
  content:'';
  position:fixed;inset:0;
  background:rgba(0,0,0,.35);
  pointer-events:none;
  z-index:1;
}
header,#chat,.bar{position:relative;z-index:10;}

/* ── header ── */
header{
  position:absolute;top:0;left:0;right:0;
  padding:20px 28px;
  display:flex;align-items:center;justify-content:space-between;
  z-index:20;
}
.logo{
  font-size:.8rem;font-weight:700;
  letter-spacing:5px;text-transform:uppercase;
  text-shadow:0 1px 10px rgba(0,0,0,.9);
}
.logo em{color:#19c37d;font-style:normal}
.pill{
  display:flex;align-items:center;gap:6px;
  background:rgba(0,0,0,.35);backdrop-filter:blur(12px);
  border:1px solid rgba(255,255,255,.12);
  border-radius:99px;padding:5px 12px;
  font-size:.7rem;letter-spacing:1px;
  text-shadow:none;
}
.dot{width:7px;height:7px;border-radius:50%;background:#19c37d;box-shadow:0 0 6px #19c37d}

/* ── chat scroll area ── */
#chat{
  flex:1;
  overflow-y:auto;
  padding:90px 20px 20px;
  display:flex;flex-direction:column;gap:14px;
  position:relative;z-index:10;
}
#chat::-webkit-scrollbar{width:3px}
#chat::-webkit-scrollbar-thumb{background:rgba(255,255,255,.2);border-radius:2px}

/* ── hero ── */
.hero{
  margin:auto;text-align:center;
  padding:0 20px 60px;
  pointer-events:none;
}
.hero h1{
  font-size:clamp(2.2rem,8vw,4.5rem);
  font-weight:700;letter-spacing:6px;text-transform:uppercase;
  line-height:1.08;
  text-shadow:0 2px 12px rgba(0,0,0,.9),0 0 60px rgba(0,0,0,.5);
  margin-bottom:12px;
}
.hero p{
  color:rgba(255,255,255,.65);
  font-size:.88rem;letter-spacing:.5px;font-weight:400;
  text-shadow:0 1px 8px rgba(0,0,0,.9);
}

/* ── messages ── */
.row{display:flex;gap:0;align-items:flex-end;max-width:680px;width:100%;margin:0 auto}
.row.user{flex-direction:row-reverse}
.row.ai{flex-direction:row}

.bubble{
  max-width:90%;
  padding:11px 16px;
  border-radius:18px;
  font-size:.92rem;line-height:1.7;
  word-break:break-word;
}
.row.user .bubble{
  background:rgba(0,0,0,.65);
  border:1px solid rgba(255,255,255,.1);
  border-bottom-right-radius:4px;
  backdrop-filter:blur(10px);
}
.row.ai .bubble{
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.14);
  border-bottom-left-radius:4px;
  backdrop-filter:blur(18px);
  text-shadow:0 1px 3px rgba(0,0,0,.5);
}
.bubble p{margin:0 0 8px}.bubble p:last-child{margin:0}
.bubble strong{color:#fff;font-weight:600}
.bubble em{font-style:italic;color:rgba(255,255,255,.85)}
.bubble code{
  background:rgba(0,0,0,.5);padding:2px 5px;
  border-radius:3px;font-family:monospace;font-size:.86em;
}
.bubble pre{
  background:rgba(0,0,0,.7);border-radius:10px;
  padding:12px;overflow-x:auto;margin:8px 0;
}
.bubble pre code{background:none;padding:0}
.bubble h1,.bubble h2,.bubble h3{margin:10px 0 4px}
.bubble ul,.bubble ol{padding-left:18px;margin:6px 0}
.bubble li{margin:3px 0}

/* typing dots */
.dots{display:inline-flex;gap:4px;padding:2px 0;align-items:center}
.dots span{
  width:5px;height:5px;border-radius:50%;
  background:rgba(255,255,255,.45);
  animation:pop 1.2s infinite both;
}
.dots span:nth-child(2){animation-delay:.2s}
.dots span:nth-child(3){animation-delay:.4s}
@keyframes pop{0%,80%,100%{transform:scale(.4);opacity:.4}40%{transform:scale(1);opacity:1}}

/* ── bottom bar ── */
.bar{
  flex-shrink:0;
  padding:12px 20px 24px;
  position:relative;z-index:20;
}
.bar-inner{
  max-width:680px;margin:0 auto;
  display:flex;align-items:flex-end;gap:10px;
  background:rgba(0,0,0,.55);
  border:1px solid rgba(255,255,255,.2);
  border-radius:24px;
  padding:10px 10px 10px 18px;
  backdrop-filter:blur(24px);
  transition:border-color .2s;
}
.bar-inner:focus-within{border-color:rgba(25,195,125,.7)}
textarea{
  flex:1;background:transparent;border:none;outline:none;
  color:#fff;
  font-family:'Josefin Sans',system-ui,sans-serif;
  font-size:14px;resize:none;max-height:130px;line-height:1.5;
  letter-spacing:.3px;
}
textarea::placeholder{color:rgba(255,255,255,.35)}
#sendBtn{
  width:38px;height:38px;border-radius:50%;border:none;
  background:#19c37d;color:#000;
  font-size:14px;font-weight:700;
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;cursor:pointer;
  transition:opacity .2s,transform .15s;
}
#sendBtn:disabled{opacity:.3;cursor:default}
#sendBtn:hover:not(:disabled){opacity:.85;transform:scale(1.07)}
</style>
</head>
<body>

<header>
  <div class="logo">ank<em>LIENT</em></div>
  <div class="pill"><div class="dot" id="dot"></div><span id="status">connecting</span></div>
</header>

<div id="chat">
  <div class="hero" id="hero">
    <h1>What can I<br>help with?</h1>
    <p>Your personal ChatGPT &mdash; running in the cloud</p>
  </div>
</div>

<div class="bar">
  <div class="bar-inner">
    <textarea id="inp" rows="1" placeholder="Message ChatGPT..."></textarea>
    <button id="sendBtn">&#9650;</button>
  </div>
</div>

<script>
var inp=document.getElementById('inp');
var btn=document.getElementById('sendBtn');
var chat=document.getElementById('chat');
var busy=false;
var hist=[];

inp.addEventListener('input',function(){
  inp.style.height='auto';
  inp.style.height=Math.min(inp.scrollHeight,130)+'px';
});
inp.addEventListener('keydown',function(e){
  if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();}
});
btn.addEventListener('click',send);

function send(){
  if(busy)return;
  var text=inp.value.trim();
  if(!text)return;
  var hero=document.getElementById('hero');
  if(hero)hero.remove();
  busy=true;btn.disabled=true;
  inp.value='';inp.style.height='auto';
  hist.push({role:'user',content:text});
  addBubble(esc(text),'user');
  var aiRow=mkRow('ai');
  var bub=aiRow.querySelector('.bubble');
  bub.innerHTML='<div class="dots"><span></span><span></span><span></span></div>';
  chat.appendChild(aiRow);bot();
  var full='';

  fetch('/v1/chat/completions',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({model:'auto',messages:hist,stream:true})
  }).then(function(r){
    if(!r.ok)throw new Error('HTTP '+r.status);
    var reader=r.body.getReader();
    var dec=new TextDecoder();
    var buf='';var started=false;
    function pump(){
      return reader.read().then(function(chunk){
        if(chunk.done)return;
        buf+=dec.decode(chunk.value,{stream:true});
        var idx;
        while((idx=buf.indexOf('\n'))!==-1){
          var line=buf.slice(0,idx).trimEnd();
          buf=buf.slice(idx+1);
          if(!line.startsWith('data: '))continue;
          var pay=line.slice(6).trim();
          if(pay==='[DONE]')return;
          try{
            var d=JSON.parse(pay);
            var delta=d&&d.choices&&d.choices[0]&&d.choices[0].delta&&d.choices[0].delta.content;
            if(delta){
              if(!started){bub.innerHTML='';started=true;}
              full+=delta;
              bub.innerHTML=md(full);
              bot();
            }
          }catch(e){}
        }
        return pump();
      });
    }
    return pump();
  }).then(function(){
    if(!full){
      return fetch('/v1/chat/completions',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({model:'auto',messages:hist,stream:false})
      }).then(function(r){return r.json();}).then(function(d){
        full=d.choices[0].message.content||'';
        bub.innerHTML=md(full);bot();
      });
    }
  }).catch(function(e){
    bub.innerHTML='<span style="color:#ff6b6b">'+e.message+'</span>';
  }).finally(function(){
    if(full)hist.push({role:'assistant',content:full});
    busy=false;btn.disabled=false;inp.focus();bot();
  });
}

function mkRow(role){
  var r=document.createElement('div');
  r.className='row '+role;
  r.innerHTML='<div class="bubble"></div>';
  return r;
}
function addBubble(html,role){
  var r=mkRow(role);
  r.querySelector('.bubble').innerHTML=html;
  chat.appendChild(r);bot();
}
function bot(){chat.scrollTop=chat.scrollHeight;}
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function md(s){
  s=s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  s=s.replace(/```[\w]*\n?([\s\S]*?)```/g,'<pre><code>$1</code></pre>');
  s=s.replace(/`([^`]+)`/g,'<code>$1</code>');
  s=s.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
  s=s.replace(/\*([^*\n]+?)\*/g,'<em>$1</em>');
  s=s.replace(/^### (.+)$/gm,'<h3>$1</h3>');
  s=s.replace(/^## (.+)$/gm,'<h2>$1</h2>');
  s=s.replace(/^# (.+)$/gm,'<h1>$1</h1>');
  s=s.replace(/^[ \t]*[-*+] (.+)$/gm,'<li>$1</li>');
  s=s.replace(/\n/g,'<br>');
  return s;
}

var dot=document.getElementById('dot');
var st=document.getElementById('status');
fetch('/health').then(function(r){return r.json();}).then(function(d){
  var ok=d.status==='healthy';
  dot.style.background=ok?'#19c37d':'#f59e0b';
  dot.style.boxShadow='0 0 6px '+(ok?'#19c37d':'#f59e0b');
  st.textContent=ok?'online':'degraded';
}).catch(function(){
  dot.style.background='#ef4444';
  st.textContent='offline';
});
</script>
</body>
</html>
